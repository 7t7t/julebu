# Alrahim 生产环境 Nginx 配置
# 将此文件放到 /etc/nginx/conf.d/cet-vralph.conf

# API 反向代理
upstream cet_api {
    server 127.0.0.1:3001;
}

# Logto 认证服务
upstream logto_auth {
    server 127.0.0.1:3010;
}

# 前端静态站点
server {
    listen 80;
    server_name cet.vralph.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cet.vralph.top;

    # SSL 证书路径（请替换为实际路径）
    ssl_certificate     /etc/nginx/ssl/vralph.top.pem;
    ssl_certificate_key /etc/nginx/ssl/vralph.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态文件（nuxt generate 输出目录）
    root /var/www/alrahim/client;
    index index.html;

    # 静态资源缓存
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        expires 30d;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}

# API 服务
server {
    listen 80;
    server_name cet-api.vralph.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cet-api.vralph.top;

    ssl_certificate     /etc/nginx/ssl/vralph.top.pem;
    ssl_certificate_key /etc/nginx/ssl/vralph.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://cet_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Logto 认证服务
server {
    listen 80;
    server_name cet-auth.vralph.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cet-auth.vralph.top;

    ssl_certificate     /etc/nginx/ssl/vralph.top.pem;
    ssl_certificate_key /etc/nginx/ssl/vralph.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://logto_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
