# vralph.top Nginx 配置
# 2024-11-28

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout 30;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 全局 Gzip
    gzip on;
    gzip_buffers 32 4k;
    gzip_min_length 1k;
    gzip_comp_level 1;
    gzip_types text/plain application/javascript application/x-javascript text/css
               application/json application/xml text/xml text/javascript
               application/x-httpd-php image/jpeg image/gif image/png image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;

    # 全局 SSL 协议与加密套件
    ssl_protocols TLSv1.2;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    # ========== Upstream 定义 ==========

    upstream apiserver {
        server 127.0.0.1:8002;
        keepalive 64;
    }

    upstream client_up {
        server 127.0.0.1:3000;
    }

    upstream cet_api {
        server 127.0.0.1:3001;
    }

    upstream logto_auth {
        server 127.0.0.1:3010;
    }

    # ========== api.vralph.top ==========

    server {
        listen 80;
        listen 443 ssl;
        server_name api.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        location /cse {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Nginx-Proxy true;
            proxy_cache_bypass $http_upgrade;
            proxy_pass http://apiserver;
        }

        location /txt {
            root /data/txt/;
            try_files $uri $uri/ /txt/index.html;
        }

        error_page 404 500 502 503 504 /50x.html;
    }

    # ========== vralph.top / www / emp 主站 ==========

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost vralph.top www.vralph.top emp.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        location / {
            root /data/julebu/apps/client/dist;
            try_files $uri $uri/ /index.html;
        }

        location /empapi/ {
            proxy_pass http://103.228.160.120:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 图片资源代理
        location ~ 103.228.160.122:9000 {
            proxy_pass https://103.228.160.122:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # ========== web.vralph.top（储能监控） ==========

    server {
        listen 80;
        listen 443 ssl;
        server_name web.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        location / {
            root /data/pv/pv-storage-monitor/frontend/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        error_page 404 500 502 503 504 /50x.html;
    }

    # ========== cet.vralph.top（Alrahim 前端） ==========

    server {
        listen 80;
        server_name cet.vralph.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cet.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        root /data/julebu/apps/client/.output/public;
        index index.html;

        location /_nuxt/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /favicon.ico {
            expires 30d;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ========== cet-api.vralph.top（Alrahim API） ==========

    server {
        listen 80;
        server_name cet-api.vralph.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cet-api.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        location / {
            proxy_pass http://cet_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # ========== cet-auth.vralph.top（Logto 认证） ==========

    server {
        listen 80;
        server_name cet-auth.vralph.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cet-auth.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        location / {
            proxy_pass http://logto_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========== cet-admin.vralph.top（Logto 管理后台） ==========

    server {
        listen 80;
        server_name cet-admin.vralph.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cet-admin.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:3011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========== empdoc.vralph.top（API 文档代理） ==========

    server {
        listen 443 ssl;
        server_name empdoc.vralph.top;

        ssl_certificate     /etc/letsencrypt/live/vralph.top-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vralph.top-0001/privkey.pem;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;

        keepalive_timeout 0;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        send_timeout 5s;
        resolver_timeout 5s;
        client_body_timeout 5s;
        client_max_body_size 5m;
        client_body_buffer_size 100k;

        location / {
            rewrite ^/(.*)$ /doc.html break;
            proxy_pass http://empdev.csenergytech.cn:8080;
            add_header Strict-Transport-Security "max-age=31536000";
        }
    }
}
