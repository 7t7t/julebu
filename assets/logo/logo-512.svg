<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" />
  <!-- Open book icon -->
  <g transform="translate(256,220)">
    <!-- Left page -->
    <path d="M-10,-60 Q-10,-80 -30,-80 L-100,-80 Q-120,-80 -120,-60 L-120,40 Q-120,60 -100,60 L-10,60 Z" fill="url(#book)" opacity="0.95"/>
    <!-- Right page -->
    <path d="M10,-60 Q10,-80 30,-80 L100,-80 Q120,-80 120,-60 L120,40 Q120,60 100,60 L10,60 Z" fill="url(#book)" opacity="0.9"/>
    <!-- Spine -->
    <path d="M-10,-80 Q0,-90 10,-80 L10,60 Q0,70 -10,60 Z" fill="#e9d5ff" opacity="0.7"/>
    <!-- Text lines on left page -->
    <line x1="-95" y1="-50" x2="-25" y2="-50" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <line x1="-95" y1="-30" x2="-35" y2="-30" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="-95" y1="-10" x2="-30" y2="-10" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <line x1="-95" y1="10" x2="-40" y2="10" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="-95" y1="30" x2="-25" y2="30" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <!-- Text lines on right page -->
    <line x1="25" y1="-50" x2="95" y2="-50" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="-30" x2="95" y2="-30" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="-10" x2="95" y2="-10" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="10" x2="95" y2="10" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="30" x2="95" y2="30" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <!-- Graduation cap above book -->
    <g transform="translate(0,-110)">
      <polygon points="0,-30 -50,0 0,10 50,0" fill="#ffffff" opacity="0.95"/>
      <line x1="50" y1="0" x2="50" y2="30" stroke="#ffffff" stroke-width="3"/>
      <circle cx="50" cy="33" r="5" fill="#fbbf24"/>
    </g>
  </g>
  <!-- ALRAHIM text -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="56" fill="#ffffff" letter-spacing="6">ALRAHIM</text>
  <!-- Subtitle -->
  <text x="256" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e9d5ff" letter-spacing="2">CET-6 PREP</text>
</svg>
